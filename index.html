<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TASK SEASON 6.1</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgba(14, 145, 238, 0.39);
            color:black;
        }
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh;
        }
        nav {
            position: fixed;
            bottom: 0;
            background-color: rgb(187, 246, 25);
            width: 100%;
            padding: 15px;
            align-items: center;
            justify-content: center;
        }
        nav a {
            padding: 15px;
            margin-right: 15px;
            cursor: pointer;
            text-decoration: none;
            color: black;
            font-weight: 700;
        }
        nav a:hover {
            background-color: cornsilk;
            cursor: pointer;
            transition: background-color .5s ease-in-out;
        }
        .galaxsi-theme {
            background-image: url('galaxsi.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: white;
        }
        .sea-theme {
            background-image: url('sea.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: white;
        }
        .forest-theme {
            background-image: url('hutan.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: white;
        }
        .info {
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 10%;
            font-size: 50px;
            font-weight: 700;
            animation: jedakJedug .5s infinite;
            color: rgb(255, 255, 255);
            text-decoration: underline;
        }
        @keyframes jedakJedug {
            0% {
                font-size: 16px;
            }
            50% {
                font-size: 18px;
            }
            100% {
                font-size: 16px;
            }
        }
        .h1 {
            color: rgb(250, 250, 247);
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="container">
        <nav>
            <a onclick="reRender()" id="home">HOME</a>
            <a onclick="galaxsiMode()" id="galaxsi">GALAXSI MODE</a>
            <a onclick="seaMode()" id="sea">SEA MODE</a>
            <a onclick="forestMode()" id="forest">FOREST MODE</a>
        </nav>
        <h1 class="h1">WELCOME TO THE WINDOWS WORLD</h1>
        <p class="info" id="info"></p>
    </div>
    <script>
        let home = document.getElementById("home");
        let galaxsi = document.getElementById("galaxsi");
        let sea = document.getElementById("sea");
        let forest = document.getElementById("forest");
        let info = document.getElementById("info");

        const LIMIT = 5;
        let counters = {
            galaxsi: 0,
            sea: 0,
            forest: 0
        };

        function ubahMode(namaMode, namaKelas) {
            if (counters[namaMode] >= LIMIT) {
                info.textContent = `FITUR ${namaMode.toUpperCase()} MODE SUDAH HABIS!`;
                return false;
            }
            counters[namaMode] += 1;
            let sisaKlik = LIMIT - counters[namaMode];
            document.body.className = namaKelas;
            if (sisaKlik === 0) {
                info.textContent = `FITUR ${namaMode.toUpperCase()} MODE SUDAH HABIS!`;
            } else {
                info.textContent = `${namaMode.toUpperCase()} MODE aktif sisa kuota klik mode ini: $ {sisaKlik}`;
                
            }
            return true;
        }
        function galaxsiMode() {
            if (document.body.className === "galaxsi-theme") {
                let sukses = ubahMode('galaksi', '');
                if (sukses) {
                    galaxsi.textContent = "GALAXSI MODE";
                    let sisaKlik = LIMIT - counters['galaxsi'];
                    info.textContent = `kembali ke BASIC MODE. Sisa kuota klik mode galaxsi/basic: ${sisaKlik}`;
                    if (sisaKlik === 0) info.textContent = `FITUR GALAXSI MODE SUDAH HABIS!`;
                }
            } else {
                let sukses = ubahMode('galaxsi', 'galaxsi-theme');
                if (sukses) {
                    galaxsi.textContent = "BASIC MODE";
                    sea.textContent = "SEA MODE";
                    forest.textContent = "FOREST MODE";
                }
            }
        }
        function seaMode() {
            if (document.body.className === "sea-theme") {
                let sukses = ubahMode('sea', '');
                if (sukses) {
                    sea.textContent = "SEA MODE";
                    let sisaKlik = LIMIT - counters['sea'];
                    info.textContent = `kembali ke BASIC MODE. Sisa kuota klik mode sea/basic: ${sisaKlik}`;
                    if (sisaKlik === 0) info.textContent = `FITUR SEA MODE SUDAH HABIS!`;
                }
            } else {
                let sukses = ubahMode('sea', 'sea-theme');
                if (sukses) {
                    sea.textContent = "BASIC MODE";
                    galaxsi.textContent = "GALAXSI MODE";
                    forest.textContent = "FOREST MODE";
                }
            }
        }
        function forestMode() {
            if (document.body.className === "forest-theme") {
                let sukses = ubahMode('forest', '');
                if (sukses) {
                    forest.textContent = "FOREST MODE";
                    let sisaKlik = LIMIT - counters['forest'];
                    info.textContent = `kembali ke BASIC MODE. Sisa kuota klik mode forest/basic: ${sisaKlik}`;
                    if (sisaKlik === 0) info.textContent = `FITUR FOREST MODE SUDAH HABIS!`;
                }
            } else {
                let sukses = ubahMode('forest', 'forest-theme');
                if (sukses) {
                    forest.textContent = "BASIC MODE";
                    galaxsi.textContent = "GALAXSI MODE";
                    sea.textContent = "SEA MODE";
                }
            }
        }
        function reRender() {
            counters.galaxsi = 0;
            counters.sea = 0;
            counters.forest = 0;
            document.body.className = "";
            galaxsi.textContent = "GALAXSI MODE";
            sea.textContent = "SEA MODE";
            forest.textContent = "FOREST MODE";
            location.reload();
        }
    </script>
</body>

</html>
